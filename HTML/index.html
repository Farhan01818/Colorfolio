     <section class="banner">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                   <div class="banner-content">
                    <h1>Crafting Digital Experiences with Passion</h1>
                    <span>Transforming ideas into elegant solutions through creative design and innovative development</span>
                    <div class="banner-buttons">
                        <button type="button" class="btn">View My Work</button> 
                        <button type="button" class="btn">View My Work</button> 
                    </div>

                   </div>

                   <div class="counter d-flex">
                    <div>
                        <h2>5+</h2>
                        <span>Years Experience</span>
                    </div>
                    <div>
                        <h2>100+</h2>
                        <span>Projects Completed</span>
                    </div>
                    <div>
                        <h2>50+</h2>
                        <span>Happy Clients</span>
                    </div>
                   </div>

                </div>

                <div class="col-md-6">
                    <div class="banner-img">
                         <img class="img-fluid" src="../IMAGES/image.png" alt="">
                    </div>
                </div>

            </div>

        </div>

     </section>
